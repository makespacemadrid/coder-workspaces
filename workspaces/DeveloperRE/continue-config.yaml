name: mks-config
version: 2.0.0
schema: v1

# El arranque sustituye esta lista por los modelos vivos descubiertos en
# Ocabra y FreeAPI. Se mantiene un fallback vacío para no publicar IDs caducados.
models: []

context:
  - provider: diff
  - provider: open
  - provider: terminal
  - provider: problems
  - provider: codebase
  - provider: code
  - provider: docs

prompts:
  - name: write-tests
    description: Write unit tests for highlighted code
    prompt: |
      Write a comprehensive set of unit tests for the selected code.
      Include setup, meaningful edge cases, and teardown if needed.
      Output only the test code. Do not modify files automatically.

docs: []
