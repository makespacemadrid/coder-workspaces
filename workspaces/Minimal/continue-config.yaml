name: mks-config
version: 1.0.6
schema: v1
models:
  # === Chat / edit / apply: roster Ocabra ctx-tagged ===
  - name: Qwen3 Coder 30b (256K)
    provider: openai
    model: qwen3-coder:30b-ctx256k
    apiBase: OCABRA_BASE_PLACEHOLDER
    apiKey: OCABRA_API_KEY_PLACEHOLDER
    roles:
      - chat
      - edit
      - apply

  - name: RavenX CyberAgent (256K)
    provider: openai
    model: ravenx-256k
    apiBase: OCABRA_BASE_PLACEHOLDER
    apiKey: OCABRA_API_KEY_PLACEHOLDER
    roles:
      - chat
      - edit
      - apply

  - name: Nemotron 3 Nano 30b (384K)
    provider: openai
    model: nemotron-3-nano:30b-ctx384k
    apiBase: OCABRA_BASE_PLACEHOLDER
    apiKey: OCABRA_API_KEY_PLACEHOLDER
    roles:
      - chat
      - edit
      - apply

  - name: Nemotron 3 Nano 30b (256K)
    provider: openai
    model: nemotron-3-nano:30b-ctx256k
    apiBase: OCABRA_BASE_PLACEHOLDER
    apiKey: OCABRA_API_KEY_PLACEHOLDER
    roles:
      - chat
      - edit
      - apply

  - name: Gemma 4 12b (256K)
    provider: openai
    model: gemma4:12b-ctx256k
    apiBase: OCABRA_BASE_PLACEHOLDER
    apiKey: OCABRA_API_KEY_PLACEHOLDER
    roles:
      - chat
      - edit
      - apply

  - name: Gemma 4 26b (160K)
    provider: openai
    model: gemma4:26b-ctx160k
    apiBase: OCABRA_BASE_PLACEHOLDER
    apiKey: OCABRA_API_KEY_PLACEHOLDER
    roles:
      - chat
      - edit
      - apply

  - name: Qwen3.6 (128K)
    provider: openai
    model: qwen3.6:ctx128k
    apiBase: OCABRA_BASE_PLACEHOLDER
    apiKey: OCABRA_API_KEY_PLACEHOLDER
    roles:
      - chat
      - edit
      - apply

  - name: Qwen3.5 27b (96K)
    provider: openai
    model: qwen3.5:27b-ctx96k
    apiBase: OCABRA_BASE_PLACEHOLDER
    apiKey: OCABRA_API_KEY_PLACEHOLDER
    roles:
      - chat
      - edit
      - apply

  - name: Ministral 3 14b (128K)
    provider: openai
    model: ministral-3:14b-ctx128k
    apiBase: OCABRA_BASE_PLACEHOLDER
    apiKey: OCABRA_API_KEY_PLACEHOLDER
    roles:
      - chat
      - edit
      - apply

  - name: Nemotron3 33b (64K)
    provider: openai
    model: nemotron3:33b-ctx64k
    apiBase: OCABRA_BASE_PLACEHOLDER
    apiKey: OCABRA_API_KEY_PLACEHOLDER
    roles:
      - chat
      - edit
      - apply

  # === Autocomplete (FIM, modelos ligeros) ===
  - name: qwen2.5-coder:7b
    provider: openai
    model: qwen2.5-coder:7b
    apiBase: OCABRA_BASE_PLACEHOLDER
    apiKey: OCABRA_API_KEY_PLACEHOLDER
    roles:
      - autocomplete
    autocompleteOptions:
      debounceDelay: 200
      maxPromptTokens: 600

  - name: qwen2.5-coder:1.5b
    provider: openai
    model: qwen2.5-coder:1.5b
    apiBase: OCABRA_BASE_PLACEHOLDER
    apiKey: OCABRA_API_KEY_PLACEHOLDER
    roles:
      - autocomplete
    autocompleteOptions:
      debounceDelay: 200
      maxPromptTokens: 600

  # === Embeddings ===
  - name: bge-m3:latest
    provider: openai
    model: bge-m3:latest
    apiBase: OCABRA_BASE_PLACEHOLDER
    apiKey: OCABRA_API_KEY_PLACEHOLDER
    roles:
      - embed

  - name: nomic-embed-text:latest
    provider: openai
    model: nomic-embed-text:latest
    apiBase: OCABRA_BASE_PLACEHOLDER
    apiKey: OCABRA_API_KEY_PLACEHOLDER
    roles:
      - embed

context:
  - provider: diff
  - provider: open
  - provider: terminal
  - provider: problems
  - provider: codebase
  - provider: code
  - provider: docs

prompts:
  - name: write-tests
    description: Write unit tests for highlighted code
    prompt: |
      Write a comprehensive set of unit tests for the selected code.
      Include setup, meaningful edge cases, and teardown if needed.
      Output only the test code. Do not modify files automatically.

docs: []
